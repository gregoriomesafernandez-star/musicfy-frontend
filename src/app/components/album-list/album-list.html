<div class="relative h-45 overflow-hidden bg-orange-300 rounded-tl-lg rounded-tr-lg -mx-8 -mt-8 mb-8">

    <!-- Degradado para que el texto se lea -->
    <div class="absolute inset-0 bg-linear-to-t from-black via-black/40 to-transparent"></div>

    <div class="absolute top-12 left-5 text-white">
        
        <h1 class="text-4xl sm:text-6xl font-bold mb-2">
            Albums
            <i class="fa-solid fa-compact-disc"></i>
        </h1>
        
    </div>

</div>

@if (albums().length === 0) {

    <p class="mt-8 text-gray-500">
        No existen albums.
    </p>

} @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5 mt-6">

        @for (album of albums(); track album._id) {

            <div [routerLink]="['/album/detail', album._id]"
                class="bg-gray-100 rounded-lg p-4
                        hover:shadow-lg cursor-pointer hover:shadow-orange-500/30
                        transition-all duration-300">

                <img
                    [src]="album.image
                        ? 'http://localhost:3000/api/get-image-album/' + album.image
                        : 'http://localhost:3000/api/get-image-album/default.png'"
                    (error)="$any($event.target).src = 'http://localhost:3000/api/get-image-album/default.png'"
                    [alt]="album.title"
                    class="w-full h-48 object-cover rounded-lg mb-4"
                >

                <h3 class="text-xl font-bold">
                    {{ album.title }}
                </h3>

                <p class="text-gray-500 mt-2 font-semibold">
                    {{ album.year }}
                </p>

                <!-- Botones -->
                @if (authService.identity()?.role === 'ROLE_ADMIN') {
                    <div class="flex items-center justify-center gap-3">

                        <button
                            [routerLink]="['/album/edit', album._id]"
                            type="button"
                            class="px-3 py-2 bg-blue-500 text-white rounded cursor-pointer hover:bg-blue-700 transition-all duration-300"
                        >
                        <i class="fa-solid fa-pen"></i>
                        
                        </button>

                        <button
                            (click)="$event.stopPropagation(); onDeleteAlbum(album._id)"
                            type="button"
                            class="px-3 py-2 bg-red-500 text-white rounded cursor-pointer hover:bg-red-700 transition-all duration-300"
                        >
                        <i class="fa-solid fa-trash"></i>
                        
                        </button>

                    </div>
                }

            </div>

        }

    </div>
}
